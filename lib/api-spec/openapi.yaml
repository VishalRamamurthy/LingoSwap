openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: translation
    description: Translation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /translate:
    post:
      operationId: translateText
      tags: [translation]
      summary: Translate text
      description: Detects the source language (unless provided) and translates text into the target language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslateRequest"
      responses:
        "200":
          description: Translation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslateResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /voice-translate:
    post:
      operationId: voiceTranslate
      tags: [translation]
      summary: Transcribe and translate audio
      description: Transcribes recorded speech, detects its language, and translates it to the target language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceTranslateRequest"
      responses:
        "200":
          description: Transcription and translation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceTranslateOutput"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TranslateRequest:
      type: object
      properties:
        text:
          type: string
          description: The text to translate
          minLength: 1
          maxLength: 5000
        sourceLanguage:
          type: string
          description: Optional source language name (e.g. "French"). Omit or set to "auto" for automatic detection.
        targetLanguage:
          type: string
          description: Target language name (e.g. "Spanish")
      required:
        - text
        - targetLanguage
    TranslateResponse:
      type: object
      properties:
        translatedText:
          type: string
          description: The translated text
        detectedLanguage:
          type: string
          description: The detected (or provided) source language name
        targetLanguage:
          type: string
          description: The target language name
      required:
        - translatedText
        - detectedLanguage
        - targetLanguage
    VoiceTranslateRequest:
      type: object
      properties:
        audioBase64:
          type: string
          description: Base64-encoded audio recording
        mimeType:
          type: string
          description: MIME type of the audio (e.g. "audio/m4a", "audio/mp4")
        targetLanguage:
          type: string
          description: Target language name (e.g. "Spanish")
        sourceLanguage:
          type: string
          description: Optional source language name. Omit for automatic detection.
      required:
        - audioBase64
        - mimeType
        - targetLanguage
    VoiceTranslateOutput:
      type: object
      properties:
        transcription:
          type: string
          description: The transcribed text from the audio
        detectedLanguage:
          type: string
          description: The detected (or provided) source language name
        translatedText:
          type: string
          description: The translated text
        targetLanguage:
          type: string
          description: The target language name
      required:
        - transcription
        - detectedLanguage
        - translatedText
        - targetLanguage
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
